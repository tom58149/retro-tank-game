name: Deploy Retro Tank Game to Google Cloud Run

on:
  push:
    branches:
      - main
      - master

env:
  PROJECT_ID: bamboo-dryad-504311-p6
  GAR_LOCATION: europe-west2
  SERVICE_REGION: europe-west1
  REPOSITORY: web-apps
  SERVICE_NAME: game-fodder
  IMAGE_NAME: europe-west2-docker.pkg.dev/bamboo-dryad-504311-p6/web-apps/game-fodder

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build Docker Container
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg VITE_SENTRY_DSN="${{ secrets.VITE_SENTRY_DSN }}" \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Image to Artifact Registry
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.SERVICE_REGION }}
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
