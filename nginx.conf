events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Suppress Nginx version disclosure
    server_tokens off;

    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Block disallowed HTTP methods for static game assets
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$ ) {
            return 405;
        }

        # Baseline Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' https://*.ingest.us.sentry.io https://*.ingest.sentry.io; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

        # Immediately drop vulnerability scanner probes (PHP, WordPress, common exploits)
        location ~* \.(php|asp|aspx|jsp|cgi)$ {
            return 404;
        }

        location ~* /(wp-admin|wp-content|wp-includes|xmlrpc\.php|wp-login\.php) {
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static game assets, sprites, audio
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|mp3|wav|ogg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # Deny access to hidden/sensitive files (.git, .env, etc.)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Health check endpoint for Cloud Run
        location /healthz {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
